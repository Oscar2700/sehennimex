
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
background: #111;
color: white;
font-family: Arial, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 20px;
}

h1 {
text-align: center;
font-size: 2rem;
}

#randomPicture {
display: block;
max-width: 100%;
max-height: 70vh;
object-fit: contain;
border-radius: 12px;
box-shadow: 0 0 25px #000;
}

<script>
const pictures = [
"img1.jpg",
"img2.jpg",
"IMG_1856.JPG"
"IMG_1852.JPG"
"IMG_1850.JPG"
"IMG_1845.JPG"
"IMG_1842.JPG"
"IMG_1841.JPG"
"IMG_1830.JPG"
];

let previousIndex = -1;

function showRandomPicture() {
let randomIndex;

if (pictures.length === 1) {
randomIndex = 0;
} else {
do {
randomIndex = Math.floor(
Math.random() * pictures.length
);
} while (randomIndex === previousIndex);
}

previousIndex = randomIndex;

document.getElementById("randomPicture").src =
pictures[randomIndex];
}

showRandomPicture();
</script>
</body>
</html>
